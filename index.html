<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LivingRelay</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.body.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;background:#f6f3ed;color:#1d2524;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;">
            <section style="max-width:560px;border:1px solid #dfd8ce;border-radius:8px;background:#fffdfa;padding:28px;box-shadow:0 18px 50px rgba(62,49,38,.08);">
              <h1 style="margin:0 0 10px;font-size:28px;">LivingRelay runs from the local dev server</h1>
              <p style="margin:0 0 20px;line-height:1.55;color:#4b5552;">This React app will not load correctly from a file URL. Open the local server instead.</p>
              <a href="http://127.0.0.1:5173/" style="display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:8px;background:#1f665b;color:white;text-decoration:none;font-weight:760;">Open LivingRelay</a>
            </section>
          </main>
        `;
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
