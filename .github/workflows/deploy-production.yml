name: Deploy Production

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/livingrelay
  PRODUCTION_DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
  PRODUCTION_DEPLOY_KEY_CONFIGURED: ${{ secrets.PRODUCTION_DEPLOY_KEY != '' }}

jobs:
  deploy:
    name: Build, publish, and deploy production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check && npm run smoke

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:production
            ${{ env.IMAGE_NAME }}:production-${{ github.sha }}

      - name: Mirror code to production repo
        if: ${{ vars.PRODUCTION_REPOSITORY != '' && env.PRODUCTION_DEPLOY_KEY_CONFIGURED == 'true' }}
        env:
          TARGET_REPOSITORY: ${{ vars.PRODUCTION_REPOSITORY }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/livingrelay-production-deploy-key
          chmod 600 ~/.ssh/livingrelay-production-deploy-key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add production "git@github.com:${TARGET_REPOSITORY}.git"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/livingrelay-production-deploy-key -o IdentitiesOnly=yes" git push production HEAD:main --force-with-lease

      - name: Trigger production runtime deploy
        if: ${{ env.PRODUCTION_DEPLOY_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "${PRODUCTION_DEPLOY_WEBHOOK_URL}"
