name: Deploy Production

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: production
      image_tag: production
      repository_variable: PRODUCTION_REPOSITORY
      deploy_key_secret: PRODUCTION_DEPLOY_KEY
      deploy_webhook_secret: PRODUCTION_DEPLOY_WEBHOOK_URL
      ecs_service_variable: PRODUCTION_ECS_SERVICE
      ecs_task_definition_variable: PRODUCTION_ECS_TASK_DEFINITION
      source_ref: ${{ inputs.ref || github.ref }}
    secrets: inherit
