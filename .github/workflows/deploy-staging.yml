name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: staging
      image_tag: staging
      repository_variable: STAGING_REPOSITORY
      deploy_key_secret: STAGING_DEPLOY_KEY
      deploy_webhook_secret: STAGING_DEPLOY_WEBHOOK_URL
      ecs_service_variable: STAGING_ECS_SERVICE
      ecs_task_definition_variable: STAGING_ECS_TASK_DEFINITION
      source_ref: ${{ github.ref }}
    secrets: inherit
