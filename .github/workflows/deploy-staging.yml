name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/livingrelay
  STAGING_DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
  REPO_SYNC_TOKEN_CONFIGURED: ${{ secrets.REPO_SYNC_TOKEN != '' }}

jobs:
  deploy:
    name: Build, publish, and deploy staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check && npm run smoke

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

      - name: Mirror code to staging repo
        if: ${{ vars.STAGING_REPOSITORY != '' && env.REPO_SYNC_TOKEN_CONFIGURED == 'true' }}
        env:
          TARGET_REPOSITORY: ${{ vars.STAGING_REPOSITORY }}
          REPO_SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add staging "https://x-access-token:${REPO_SYNC_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git push staging HEAD:main --force-with-lease

      - name: Trigger staging runtime deploy
        if: ${{ env.STAGING_DEPLOY_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "${STAGING_DEPLOY_WEBHOOK_URL}"
