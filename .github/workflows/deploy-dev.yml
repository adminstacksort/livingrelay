name: Deploy Dev

on:
  push:
    branches:
      - "codex/**"
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: dev-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: dev
      image_tag: dev
      repository_variable: DEV_REPOSITORY
      deploy_key_secret: DEV_DEPLOY_KEY
      deploy_webhook_secret: DEV_DEPLOY_WEBHOOK_URL
      ecs_service_variable: DEV_ECS_SERVICE
      ecs_task_definition_variable: DEV_ECS_TASK_DEFINITION
      source_ref: ${{ github.ref }}
    secrets: inherit
